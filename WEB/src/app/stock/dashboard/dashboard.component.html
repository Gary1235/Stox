<div class="dashboard-container">
  <div class="page-header">
    <h1>投資組合總覽</h1>
    <button class="btn-primary" (click)="openAddTransactionModal()">+ 新增交易</button>
  </div>

  <div class="summary-grid">
    <div class="card summary-card">
      <h3>總市值 (USD)</h3>
      <div class="value">{{ portfolio.totalValue | currency: 'USD' }}</div>
    </div>

    <div class="card summary-card">
      <h3>總損益</h3>
      <div class="value" [class.profit]="portfolio.totalGainLoss > 0" [class.loss]="portfolio.totalGainLoss < 0">
        {{ portfolio.totalGainLoss > 0 ? '+' : '' }}{{ portfolio.totalGainLoss | currency: 'USD' }}
      </div>
      <div class="sub-text">自建倉以來</div>
    </div>

    <div class="card summary-card">
      <h3>持有檔數</h3>
      <div class="value">{{ portfolio.holdingCount }} 檔</div>
    </div>
  </div>

  <div class="detail-area">
    <div class="card table-card">
      <div class="card-header">
        <h2>持倉明細</h2>
      </div>
      <div class="table-responsive">
        <comp-shared-list [columns]="detailColumns" [rowData]="rowData" (actionClick)="handleTableAction($event)"> </comp-shared-list>
      </div>
    </div>
    <div class="card pie-card">
      <comp-pie-chart [rawData]="chartData()"></comp-pie-chart>
    </div>
  </div>
</div>

@if (isTradeModalOpen) {
  <app-modal [title]="modalTitle" [isOpen]="isTradeModalOpen" (closeModal)="closeTradeModal()">
    <app-transaction-form [defaultStockData]="selectedStockFormDefaults" [actionType]="actionType()" (submitted)="handleTransactionSubmit($event)" (cancelled)="closeTradeModal()">
    </app-transaction-form>
  </app-modal>
}
